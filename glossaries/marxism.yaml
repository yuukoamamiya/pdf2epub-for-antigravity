- id: marxist-political-economy-en-zh:bank-rate
  terms:
    en:
      preferred: Bank Rate
    zh-Hans:
      preferred: 银行利率
      policy: preferred
  note: 'Political Economy of Money and Finance: 指央行规定或设定的利率。19—20世纪英国贴现或再贴现制度语境中可译“银行贴现率”；现代英国 Bank Rate 是英格兰银行向存放资金的商业银行支付的政策利率，并非一律指央行贷款贴现率。参见
    Cambridge Dictionary: https://dictionary.cambridge.org/us/dictionary/english-chinese-simplified/bank-rate；Bank of England:
    https://www.bankofengland.co.uk/monetary-policy/the-interest-rate-bank-rate。'
  category: central banking policy
  provenance:
    source_table: marxist-political-economy-en-zh.yaml
    source_id: bank-rate
    original_record:
      id: bank-rate
      source: Bank Rate
      target: 银行利率
      policy: preferred
      category: central banking policy
      note: 'Political Economy of Money and Finance: 指央行规定或设定的利率。19—20世纪英国贴现或再贴现制度语境中可译“银行贴现率”；现代英国 Bank Rate 是英格兰银行向存放资金的商业银行支付的政策利率，并非一律指央行贷款贴现率。参见
        Cambridge Dictionary: https://dictionary.cambridge.org/us/dictionary/english-chinese-simplified/bank-rate；Bank of
        England: https://www.bankofengland.co.uk/monetary-policy/the-interest-rate-bank-rate。'
