# Scope: communication political economy and its directly related media/advertising vocabulary.
# Terms without stable, independently verifiable Chinese usage were intentionally excluded.
# All retained targets are preferred translations; promote to fixed only after editorial review.
# Per-entry web verification: political-economy-of-communication-verification.md
schema_version: 1
metadata:
  name: political-economy-of-communication
  domain: Political economy of communication
  source_language: English
  target_language: Chinese
  version: '2026-10-19'
entries:
- id: audience-commodity
  source: audience commodity
  target: 受众商品
  category: Political Economy of Communication
  note: 达拉斯·斯麦思传播政治经济学的核心概念：广告支持型媒介将被组织和测量的受众注意力、观看时间及其相关特征作为商品出售给广告主。
  policy: preferred
- id: audience-labour
  source: audience labour
  variants:
  - audience labor
  target: 受众劳动
  category: Political Economy of Communication
  note: 传播政治经济学中对受众媒介使用活动的称呼，强调受众的观看、参与和注意力如何被纳入媒介商品化过程。
  policy: preferred
- id: audience-power
  source: audience-power
  variants:
  - audience power
  target: 受众力
  category: Political Economy of Communication
  note: 杰哈利与利万特关于受众作为媒介生产要素的理论术语，指受众被商业媒介组织、动员并投入观看活动的能力。
  policy: preferred
- id: watching-power
  source: watching-power
  variants:
  - watching power
  target: 观看力
  category: Political Economy of Communication
  note: 指受众进行观看、从而为商业媒介提供可售观看时间的能力；是“受众商品”理论中与观看活动相关的核心术语。
  policy: preferred
- id: necessary-watching-time
  source: necessary watching time
  target: 必要观看时间
  category: Political Economy of Communication
  note: 杰哈利与利万特理论中的观看时间部分：用于补偿媒介节目生产成本的观看时间。
  policy: preferred
- id: surplus-watching-time
  source: surplus watching time
  target: 剩余观看时间
  category: Political Economy of Communication
  note: 超出必要观看时间、主要通过观看广告而为商业媒介带来额外价值的观看时间。
  policy: preferred
- id: watching-as-working
  source: watching as working
  variants:
  - watching as labour
  - watching as labor
  target: 观看即工作
  category: Political Economy of Communication
  note: 杰哈利与利万特关于商业电视观看活动的核心命题；中文学术译名采用《观看即工作：受众意识的价值增殖》的正式题名。
  policy: preferred
- id: commercial-media
  source: commercial media
  target: 商业媒体
  category: Political Economy of Communication
  note: 以广告、受众商品或其他商业收入为主要运行基础的媒介组织和媒介系统。
  policy: preferred
- id: broadcasting
  source: broadcasting
  target: 广播
  category: Media Industry / Political Economy of Communication
  note: 面向广泛大众进行点对面传播的广播形态；在本书语境中与 narrowcasting（窄播）相对。
  policy: preferred
- id: narrowcasting
  source: narrowcasting
  target: 窄播
  category: Media Industry / Political Economy of Communication
  note: 面向特定、细分受众进行的定向传播形态；在媒介经营中通常与受众细分和广告市场定位相联系。
  policy: preferred
- id: ratings
  source: ratings
  target: 收视率
  category: Media Economics / Audience Measurement
  note: 电视媒介语境下特定时段或节目收看人数占总体推及人口的比例，是广告定价和媒介竞争的重要指标。
  policy: preferred
- id: psychographics
  source: psychographics
  target: 心理统计学
  category: Audience Research / Advertising
  note: 依据受众的生活方式、价值观、兴趣、态度和个性等心理变量进行的受众分析或细分。
  policy: preferred
- id: demographics
  source: demographics
  target: 人口统计学
  category: Audience Research / Advertising
  note: 依据年龄、性别、收入、教育程度等人口统计变量描述或细分受众。
  policy: preferred
- id: market-segmentation
  source: market segmentation
  target: 市场细分
  category: Media Economics / Advertising
  note: 依据消费者或受众的需求、特征和行为，将整体市场划分为若干细分群体的营销与媒介经营方法。
  policy: preferred
- id: codes-of-advertising
  source: codes of advertising
  variants:
  - The Codes of Advertising
  target: 广告符码
  category: Advertising / Political Economy of Communication
  note: 苏特·杰哈利著作 The Codes of Advertising 的正式中文书名，也是本书讨论广告如何组织商品意义与受众关系的核心概念。
  policy: preferred
- id: informationalized-capitalism
  source: informationalized capitalism
  variants:
  - informational capitalism
  target: 信息化资本主义
  category: Political Economy of Communication
  note: 丹·席勒的核心理论范畴：资本主义市场逻辑与商品化机制全面渗透并重塑信息、通信网络与知识生产的历史性发展阶段。
  policy: preferred
- id: information-commodification
  source: information commodification
  variants:
  - commodification of information
  target: 信息商品化
  category: Political Economy of Communication
  note: 资本通过法律、技术与制度屏障，把社会共享的知识、符号、数据和文化创造转化为专有营利商品的演进过程。
  policy: preferred
- id: information-society
  source: information society
  target: 信息社会
  category: Social Theory / Political Economy of Communication
  note: 以信息和知识为核心资源的后工业阶段论述；传播政治经济学通常强调其与资本主义商品化逻辑的连续性而非断裂。
  policy: preferred
- id: digital-capitalism
  source: digital capitalism
  target: 数字资本主义
  category: Political Economy of Communication
  note: 丹·席勒使用的范畴：计算机网络并非脱离现实的中立空间，而是全球资本扩张与市场网络重构的前沿。
  policy: preferred
- id: culture-industry
  source: culture industry
  target: 文化工业
  category: Critical Theory / Media Studies
  note: 阿多诺与霍克海默提出的批判概念，指高度标准化、商业化与集中化的文化生产机制。
  policy: preferred
- id: intellectual-property
  source: intellectual property
  variants:
  - intellectual property rights
  - IPR
  target: 知识产权
  category: Law / Political Economy of Communication
  note: 包括专利、版权与商标在内的专有权利体系，是把公共知识与非物质产品圈围为私有商品的关键制度工具。
  policy: preferred
- id: media-convergence
  source: media convergence
  target: 媒介融合
  category: Communication Technology / Media Policy
  note: 数字化条件下电信、计算机网络与大众传媒在技术平台、产业所有权和内容分发上的整合。
  policy: preferred
- id: digital-divide
  source: digital divide
  target: 数字鸿沟
  category: Information Policy / Political Economy of Communication
  note: 不同社会群体、阶级、性别和地区在获取与使用信息通信技术及网络资源方面的结构性不平等。
  policy: preferred
- id: cultural-imperialism
  source: cultural imperialism
  target: 文化帝国主义
  category: Critical Communication Studies
  note: 赫伯特·席勒等学者提出的批判概念，指核心资本主义国家借助媒介垄断向外围国家输出商业消费主义与文化依赖。
  policy: preferred
- id: public-service-broadcasting
  source: public-service broadcasting
  variants:
  - public service broadcasting
  target: 公共服务广播
  category: Media Policy / Political Economy of Communication
  note: 以公共利益、公民文化和民主讨论为宗旨，独立于商业广告与政党私利的公共媒介制度。
  policy: preferred
- id: product-placement
  source: product placement
  target: 植入式广告
  category: Advertising / Media Economics
  note: 把特定品牌、商品或服务嵌入电影、电视剧或游戏叙事中的隐性广告形式。
  policy: preferred
- id: deregulation
  source: deregulation
  target: 放松管制
  category: Media Policy / Political Economy of Communication
  note: 新自由主义政策取向：削减国家对电信、媒体等关键公共事业的准入、定价与公用事业义务限制。
  policy: preferred
- id: free-flow-of-information
  source: free flow of information
  variants:
  - free flow of information doctrine
  target: 信息自由流动
  category: International Communication / Political Economy of Communication
  note: 二战后美国推动的国际传播主张，常被批评为跨国媒介和通讯社的全球扩张提供合法性。
  policy: preferred
- id: monopoly-capital
  source: monopoly capital
  target: 垄断资本
  category: Marxist Political Economy / Media Studies
  note: 巴兰与斯威齐的范畴：现代资本主义由少数巨型寡头企业支配市场与剩余吸收的结构性特征。
  policy: preferred
- id: telecommunications-policy
  source: telecommunications policy
  target: 电信政策
  category: Telecommunications / Public Policy
  note: 国家关于电信网络建设、频谱划分、市场准入、反垄断与互联互通的制度安排和法律规则。
  policy: preferred
- id: private-line
  source: private line
  variants:
  - private-wire
  target: 专用线路
  category: Telecommunications / Political Economy of Communication
  note: 企业或特定机构租用、专供内部封闭通信使用的点对点专线。
  policy: preferred
- id: transnationalization
  source: transnationalization
  variants:
  - transnationalisation
  target: 跨国化
  category: Global Political Economy / Media Studies
  note: 媒介与文化资本跨越民族国家边界，通过跨国并购、合资和全球分销网络扩展资本循环的过程。
  policy: preferred
- id: public-good
  source: public good
  variants:
  - public goods
  target: 公共品
  category: Economics / Information Policy
  note: 具有非排他性和非竞争性消费特征的产品或服务；信息常被讨论为具有公共品特征，但资本通过法律制造稀缺性以实现商品化。
  policy: preferred
- id: information-work
  source: information work
  variants:
  - information labor
  - information labour
  target: 信息劳动
  category: Sociology of Work / Political Economy of Communication
  note: 以产生、处理、编码、传输和解释符号、数据及思想为内容的劳动形态。
  policy: preferred
- id: cultural-diversity
  source: cultural diversity
  target: 文化多样性
  category: Cultural Policy / International Communication
  note: 各民族与社群文化表现形式的总和；常作为反抗跨国文化垄断与全球同质化的政策依据。
  policy: preferred
- id: communicative-capitalism
  source: communicative capitalism
  target: 传播资本主义
  category: Political Economy of Communication
  note: 指网络交互、意见表达和传播活动本身被商品化并纳入资本循环的理论范畴；中文文献亦见“交往资本主义”，本表采用“传播资本主义”。
  policy: preferred
- id: free-labor
  source: free labor
  variants:
  - free labour
  target: 无偿劳动
  category: Digital Labour / Political Economy of Communication
  note: 用户、玩家和网络受众在自愿或享受状态下提供的无偿内容、数据与注意力生产；中文文献亦见“免费劳动”，本表采用“无偿劳动”。
  policy: preferred
- id: information-exceptionalism
  source: information exceptionalism
  target: 信息例外主义
  category: Information Political Economy
  note: 认为信息因零边际成本等特性而脱离一般资本积累规律的理论假定；亦译“信息例外论”。
  policy: preferred
- id: digital-labour
  source: digital labour
  variants:
  - digital labor
  target: 数字劳动
  category: Political Economy of Communication / Digital Labour
  note: 在数字媒体、平台和信息通信技术环境下生产或加工信息与数据的劳动，包含受薪与无偿形态。
  policy: preferred
- id: copyleft
  source: copyleft
  target: copyleft
  category: Information Politics / Law
  note: 利用版权法反向保障使用者自由、要求衍生作品按同许可分发的机制；中文文献常译“著佐权”“版权左”，本表按编辑决定保留原词。
  policy: preferred
- id: public-domain
  source: public domain
  target: 公有领域
  category: Information Politics / Law
  note: 不受专有版权或专利保护、任何人可自由使用的知识空间，是信息公地与知识产权边界的关键概念。
  policy: preferred
- id: digital-commons
  source: digital commons
  variants:
  - digital common
  target: 数字公地
  category: Information Politics
  note: 数字网络空间中由社群协同创造、维护并向所有人开放的信息、知识、软件与文化资源池。
  policy: preferred
- id: political-economy-of-communication
  source: political economy of communication
  target: 传播政治经济学
  category: Communication Studies
  note: 从生产、流通、所有权集中和阶级权力结构出发批判性考察媒介、电信与信息系统的学术范式。
  policy: preferred
- id: playbour
  source: playbour
  variants:
  - playbor
  - play-bour
  target: 玩工
  category: Digital Labour
  note: 指游戏或游玩与劳动边界模糊、玩家的创造性游玩被平台无偿抽取价值的现象；亦见“游玩劳动”等译法，本表采用“玩工”。
  policy: preferred
- id: californian-ideology
  source: Californian ideology
  variants:
  - the Californian ideology
  target: 加州意识形态
  category: Critical Theory / Media Studies
  note: 硅谷将反主流文化自由想象与新自由主义市场崇拜混合的技术乌托邦意识形态；亦见“加利福尼亚意识形态”。
  policy: preferred
