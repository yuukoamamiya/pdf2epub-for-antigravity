name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked
      - name: Check workflow contract
        run: uv run python scripts/check_workflow_contract.py
      - name: Run tests
        run: uv run pytest -q
      - name: Check patch whitespace
        run: git diff --check
