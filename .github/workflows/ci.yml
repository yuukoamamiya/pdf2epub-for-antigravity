name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Check workflow contract
        run: uv run --python ${{ matrix.python-version }} python scripts/check_workflow_contract.py
      - name: Check undefined names
        run: uvx --from ruff==0.14.1 ruff check pdf2epub --select F821,F822,F823
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q
      - name: Check patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          require_commit() {
            local revision="$1"
            if [[ ! "$revision" =~ ^[0-9a-fA-F]{40}$ ]] || ! git cat-file -e "$revision^{commit}" 2>/dev/null; then
              echo "Expected an available commit SHA, got an invalid or missing revision." >&2
              return 1
            fi
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            require_commit "$base"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            if [[ ! "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || ! git check-ref-format "refs/heads/$DEFAULT_BRANCH"; then
              echo "Default branch name is missing or invalid." >&2
              exit 1
            fi
            default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
            git fetch origin "refs/heads/$DEFAULT_BRANCH:$default_ref"
            require_commit "$(git rev-parse "$default_ref")"
            base="$(git merge-base "$default_ref" HEAD || true)"
            if [[ -z "$base" ]] || [[ "$base" == "$(git rev-parse HEAD)" ]]; then
              base="$(git hash-object -w -t tree --stdin < /dev/null)"
            else
              require_commit "$base"
            fi
          else
            base="$BEFORE_SHA"
            require_commit "$base"
          fi

          git diff --check "$base" HEAD
