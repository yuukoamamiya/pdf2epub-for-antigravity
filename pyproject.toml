[project]
name = "pdf2epub-for-antigravity"
version = "0.2.0"
description = "PDF to EPUB converter with Antigravity Subagent workflows and adaptive PDF compression"
authors = [
    {name = "Amamiya Yuuko", email = "39460830+yuukoamamiya@users.noreply.github.com"},
    {name = "ShenSheiBot", email = "shensheibot@protonmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["antigravity", "gemini", "pdf2epub", "ocr", "epub", "chandra", "japanese-ocr", "academic-pdf"]

dependencies = [
    "pyyaml>=6.0.2",
    "pypdf>=5.4.0",
    "google-genai>=1.70.0,<2.0.0",
    "pypdf2>=3.0.1",
    "pymupdf>=1.25.4",
    "pillow>=11.1.0",
    "boto3>=1.38.2",
    "loguru>=0.7.3",
    "markdown>=3.8.2",
    "tiktoken>=0.11.0",
    "regex>=2024.0.0",
    "anthropic>=0.62.0",
    "tenacity>=9.1.2",
    "google-cloud-vision>=3.10.2",
    "opencv-python>=4.12.0.88",
    "pytesseract>=0.3.13",
    "azure-ai-documentintelligence>=1.0.2",
    "openai>=1.102.0",
    "langdetect>=1.0.9",
    "unicodeitplus>=0.3.1",
    "latex2mathml>=3.78.1",
    "beautifulsoup4>=4.14.2",
    "markdownify>=1.2.2,<2.0.0",
    "lxml>=6.0.2",
    "tinycss2>=1.2.1",
    "cssselect2>=0.7.0",
    "mobi>=0.4.1",
    "protobuf>=7.36.0",
    "sentence-transformers>=2.2.0",
    "pikepdf>=10.3.0",
    "rapidfuzz>=3.14.3",
    "google-cloud-storage>=3.4.1",
    "json-repair>=0.39.0",
]

[project.urls]
Homepage = "https://github.com/yuukoamamiya/pdf2epub-for-antigravity"
Repository = "https://github.com/yuukoamamiya/pdf2epub-for-antigravity.git"
"Upstream Repository" = "https://github.com/ShenSheiBot/pdf2epub"

[project.scripts]
pdf2epub = "pdf2epub.cli:main"
pdf2epub-for-antigravity = "pdf2epub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["pdf2epub"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
